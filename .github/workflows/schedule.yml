name: PBL定时运行
on:
  schedule:
    - cron: "50 0 * * 1-5"  # 北京时间 周一至周五 08:50 盘前AI分析（DeepSeek Flash）
    - cron: "0 6 * * 1-5"   # 北京时间 周一至周五 14:00 盘中风险监控 + AI盘中分析
    - cron: "25 6 * * 1-5"  # 北京时间 14:25 冗余补跑（GitHub定时投递可能延迟/漏跑）
    - cron: "0 8 * * 1-5"   # 北京时间 周一至周五 16:00 收盘全流程 + AI收盘复盘
    - cron: "25 8 * * 1-5"  # 北京时间 16:25 冗余补跑（幂等，不会重复生成决策）
    - cron: "0 2 * * 6"     # 北京时间 周六 10:00 周报
    - cron: "25 2 * * 6"    # 北京时间 周六 10:25 冗余补跑
  workflow_dispatch:
    inputs:
      task:
        description: 运行任务
        type: choice
        options: [eod, ai, riskwatch, weekly, report, validate, verify]
        default: eod
permissions:
  contents: write
  issues: write
concurrency:
  group: pbl-run
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: pip install --retries 5 --timeout 60 -r requirements.txt
      - name: 安装中文字体（图表用，失败不影响主流程）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk || echo "字体安装失败，图表中文可能显示为方框"
      - name: 选择任务
        # 关键：按"实际到达时的北京时间"决定做什么，而不是按触发它的 cron 槽位。
        # GitHub 定时任务实测会延迟 2~7 小时，按槽位判断会把盘前任务误判成 eod，
        # 于是在盘中用不完整的当日K线跑完整流水线（09-11 已实际发生：成交额写成 nan）。
        # 注意 job 级 env 已设 TZ=Asia/Shanghai，故 date 即北京时间。
        run: |
          H=$(date +%H); M=$(date +%M); WD=$(date +%u)
          if [ -n "${{ inputs.task }}" ]; then
            TASK="${{ inputs.task }}"
          elif [ "$WD" = "6" ]; then
            TASK=weekly                                  # 周六：周报
          elif [ "$H" -lt 9 ] || { [ "$H" = "09" ] && [ "$M" -lt 25 ]; }; then
            TASK=ai                                      # 09:25 前：盘前计划
          elif [ "$H" -lt 15 ]; then
            TASK=riskwatch                               # 09:25~15:00：盘中风控
          else
            TASK=eod                                     # 15:00 后：收盘全流程
          fi
          echo "TASK=$TASK" >> $GITHUB_ENV
          echo "北京时间 $(date +'%F %H:%M')，本次执行任务：$TASK"
      - name: 运行流水线
        # 密钥只注入这一步（不放到 job 级 env），缩小暴露面；日志中绝不打印该变量
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python cloud_run.py $TASK
      - name: 失败告警（自动开Issue）
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "⚠️ 流水线失败 $(TZ=Asia/Shanghai date +%F' '%H:%M)" \
            --body "任务 $TASK 运行失败，请查看 Actions 日志：https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} （常见原因：东财数据源波动、依赖安装失败、代码异常）" || echo "issue 创建失败（不影响主流程）"
